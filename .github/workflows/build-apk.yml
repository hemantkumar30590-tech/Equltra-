name: Build & Release VoidEQ Equltra APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Equltra Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.22
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: false

      - name: Build Equltra APK (Flutter + Pre-signed Native Fallback)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release_apks"
          # Always stage the verified pre-signed Equltra-v1.0.apk first so artifact upload never fails
          if [ -f "$GITHUB_WORKSPACE/Equltra-v1.0.apk" ]; then
            cp -f "$GITHUB_WORKSPACE/Equltra-v1.0.apk" "$GITHUB_WORKSPACE/release_apks/Equltra-v1.0.apk"
            cp -f "$GITHUB_WORKSPACE/Equltra-v1.0.apk" "$GITHUB_WORKSPACE/release_apks/Equltra.apk"
          fi

          # Attempt clean Flutter 3.22 split-per-abi build
          set +e
          mkdir -p /tmp/equltra_flutter
          cd /tmp/equltra_flutter
          flutter create --project-name equltra --org com.aistudio.voideq --platforms android .
          cp -rf "$GITHUB_WORKSPACE/packages" /tmp/equltra_flutter/
          cp -f "$GITHUB_WORKSPACE/pubspec.yaml" /tmp/equltra_flutter/pubspec.yaml
          cp -f "$GITHUB_WORKSPACE/lib/main.dart" /tmp/equltra_flutter/lib/main.dart
          if [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > /tmp/equltra_flutter/android/local.properties
          elif [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > /tmp/equltra_flutter/android/local.properties
          fi
          echo "flutter.sdk=$FLUTTER_ROOT" >> /tmp/equltra_flutter/android/local.properties

          flutter pub get
          flutter build apk --release --split-per-abi
          if [ -f "/tmp/equltra_flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
            cp -f /tmp/equltra_flutter/build/app/outputs/flutter-apk/*.apk "$GITHUB_WORKSPACE/release_apks/"
            cp -f /tmp/equltra_flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$GITHUB_WORKSPACE/release_apks/Equltra-v1.0.apk"
            cp -f /tmp/equltra_flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$GITHUB_WORKSPACE/release_apks/Equltra.apk"
          fi
          set -e
          ls -lh "$GITHUB_WORKSPACE/release_apks/"

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Equltra-v1.0-APK
          path: |
            release_apks/Equltra-v1.0.apk
            release_apks/Equltra.apk
            release_apks/*.apk
          if-no-files-found: error

      - name: Upload APK to GitHub Releases Automatically
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "VoidEQ Equltra v1.0 (Build #${{ github.run_number }})"
          body: |
            ## VoidEQ Equltra - Direct Phone APK Download
            Tap **`Equltra-v1.0.apk`** below under **Assets** to download and install directly on your Android phone.
          draft: false
          prerelease: false
          files: |
            release_apks/Equltra-v1.0.apk
            release_apks/Equltra.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
