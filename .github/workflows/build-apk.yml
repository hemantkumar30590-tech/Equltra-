name: Build & Release VoidEQ Equltra APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Equltra Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Stage Verified Native Equltra-v1.0.apk (10-Band DynamicsProcessing + YouTube Hook)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release_apks"
          if [ -f "$GITHUB_WORKSPACE/Equltra-v1.0.apk" ]; then
            cp -f "$GITHUB_WORKSPACE/Equltra-v1.0.apk" "$GITHUB_WORKSPACE/release_apks/Equltra-v1.0.apk"
            cp -f "$GITHUB_WORKSPACE/Equltra-v1.0.apk" "$GITHUB_WORKSPACE/release_apks/Equltra.apk"
          fi
          ls -lh "$GITHUB_WORKSPACE/release_apks/"

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Equltra-v1.0-APK
          path: |
            release_apks/Equltra-v1.0.apk
            release_apks/Equltra.apk
          if-no-files-found: error

      - name: Upload APK to GitHub Releases Automatically
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "VoidEQ Equltra v1.0 (Build #${{ github.run_number }})"
          body: |
            ## VoidEQ Equltra - Direct Phone APK Download (YouTube & Global Audio Fixed)
            Tap **`Equltra-v1.0.apk`** below under **Assets** to download and install directly on your Android phone.
            - **YouTube & System Audio Support:** Uses Android 9+ `DynamicsProcessing` (10-Band PreEQ + 10-Band PostEQ + Multi-Band Compressor + Limiter), `LoudnessEnhancer`, `AudioPlaybackCallback`, and exported `AudioEffectSessionReceiver`.
            - **Background Service:** Sticky notification with **Bypass EQ**, **Next Preset**, and **Re-Hook YouTube** controls.
          draft: false
          prerelease: false
          files: |
            release_apks/Equltra-v1.0.apk
            release_apks/Equltra.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
