name: Build & Release VoidEQ Equltra APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Equltra Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Stage Verified Native Equltra-v1.0.apk (15 Device Presets + Import/Export + YouTube Hook)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release_apks"
          if [ -f "$GITHUB_WORKSPACE/Equltra-v1.0.apk" ]; then
            cp -f "$GITHUB_WORKSPACE/Equltra-v1.0.apk" "$GITHUB_WORKSPACE/release_apks/Equltra-v1.0.apk"
            cp -f "$GITHUB_WORKSPACE/Equltra-v1.0.apk" "$GITHUB_WORKSPACE/release_apks/Equltra.apk"
          fi
          ls -lh "$GITHUB_WORKSPACE/release_apks/"

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Equltra-v1.0-APK
          path: |
            release_apks/Equltra-v1.0.apk
            release_apks/Equltra.apk
          if-no-files-found: error

      - name: Upload APK to GitHub Releases Automatically
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "VoidEQ Equltra v1.0 (Build #${{ github.run_number }})"
          body: |
            ## VoidEQ Equltra - Direct Phone APK Download
            Tap **`Equltra-v1.0.apk`** below under **Assets** to download and install directly on your Android phone.
            - **15 Device-Specific EQ Presets (Oct 2026 Latest):** AirPods Pro 3, AirPods 4 ANC, Sony WF-1000XM5/XM6, WH-1000XM6, Galaxy Buds 3 Pro / 4 Pro, Bose QC Ultra 2nd Gen, Sennheiser Momentum 4, Pixel Buds Pro 2, JBL Tour Pro 3, OnePlus Buds Pro 3, Nothing Ear (a), Boat/Noise/Realme Buds, and Over-ear Generic.
            - **Custom Preset Import/Export:** Supports `.json`, AutoEQ `.txt`, and `.equltra` files + WhatsApp/Telegram share + "My Imports" manager.
            - **YouTube & System Audio Support:** Android 9+ `DynamicsProcessing` (10-Band PreEQ + PostEQ + Multi-Band Compressor + Limiter) + `LoudnessEnhancer` + Background DSP notification.
          draft: false
          prerelease: false
          files: |
            release_apks/Equltra-v1.0.apk
            release_apks/Equltra.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
