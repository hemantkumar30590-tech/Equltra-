name: Build & Release VoidEQ Equltra APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Equltra Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter 3.22
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Prepare Clean Flutter Build Environment & local.properties
        run: |
          mkdir -p /tmp/equltra_build
          cp pubspec.yaml /tmp/equltra_build/
          cp -r lib /tmp/equltra_build/
          cp -r packages /tmp/equltra_build/
          cd /tmp/equltra_build
          flutter create . --project-name equltra --org com.aistudio.voideq --platforms android
          cp -f "$GITHUB_WORKSPACE/android/app/src/main/AndroidManifest.xml" android/app/src/main/AndroidManifest.xml
          cp -f "$GITHUB_WORKSPACE/android/app/build.gradle" android/app/build.gradle
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      - name: Run flutter pub get
        working-directory: /tmp/equltra_build
        run: flutter pub get

      - name: Build Split-Per-ABI Release APKs
        working-directory: /tmp/equltra_build
        run: flutter build apk --release --split-per-abi

      - name: Package Equltra-v1.0.apk for Release & Artifacts
        run: |
          mkdir -p release_apks
          cp /tmp/equltra_build/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_apks/Equltra-v1.0.apk
          cp /tmp/equltra_build/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_apks/Equltra.apk
          cp /tmp/equltra_build/build/app/outputs/flutter-apk/*.apk release_apks/

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Equltra-v1.0-APK
          path: |
            release_apks/Equltra-v1.0.apk
            release_apks/Equltra.apk
            release_apks/app-*-release.apk
          if-no-files-found: error

      - name: Upload APK to GitHub Releases Automatically
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "VoidEQ Equltra v1.0 (Build #${{ github.run_number }})"
          body: |
            ## VoidEQ Equltra - Direct Phone APK Download
            Tap **`Equltra-v1.0.apk`** below under **Assets** to download and install directly on your Android phone.
            - **Theme:** AMOLED Pitch Black Material 3
            - **DSP:** 10-Band EQ, Bass Boost, Reverb, Spatial 3D
            - **Presets:** Flat, Bass Boost, Warm, Theater, Dialogue Boost, Action Mode, Soft, Late Night, Vocal Clarity
          draft: false
          prerelease: false
          files: |
            release_apks/Equltra-v1.0.apk
            release_apks/Equltra.apk
            release_apks/app-arm64-v8a-release.apk
            release_apks/app-armeabi-v7a-release.apk
            release_apks/app-x86_64-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
